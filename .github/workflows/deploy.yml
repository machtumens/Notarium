name: Deploy Notarium

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    # Disabled: re-enabled in Wave 4 after staging exists and secrets are set. Every run
    # since January failed at the missing VERCEL_TOKEN, so a push must not trigger this.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Deploy Frontend
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

      # The source-zip-to-R2 backup step that used to follow `wrangler deploy` is gone:
      # R2 is not enabled on the account (owner decision H4).
      - name: Deploy Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd backend
          npm install
          npx wrangler deploy
