# Notarium-main gate. Three independent jobs; every step is a hard failure — nothing falls back
# to an echo or carries on after an error. backend: Worker types, workerd contract tests, wrangler
# dry-run bundle.
# frontend (legacy Vercel site): install, production build, audit of shipped dependencies.
# secrets: scan for key-shaped strings. No deploy job — deploy.yml is disabled until Wave 4.
name: ci

on:
  push:
    # master is the branch of record (H2). main is an unrelated history kept in the trigger only
    # until it is retired.
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck worker
        run: npx tsc --noEmit
      - name: Typecheck tests
        run: npx tsc --noEmit -p test/tsconfig.json
      - name: Contract tests (vitest, workerd pool)
        # @cloudflare/vitest-pool-workers pulls the Linux workerd binary in through npm; no extra
        # setup or --pool flags are needed on ubuntu-latest.
        run: npm test
      - name: Bundle check (wrangler deploy --dry-run)
        # --dry-run only bundles and prints bindings; it never contacts Cloudflare and exits 0
        # with no CLOUDFLARE_API_TOKEN and no wrangler login. Nothing is deployed from here.
        run: npx wrangler deploy --dry-run --outdir /tmp/wr-dry

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck is deliberately not run for the legacy site: `npx tsc --noEmit` fails on master
      # today with 76 errors across 30 files (unused locals, missing @types/node and @types/three,
      # hooks calling API methods that do not exist). Faking a pass with a fallback echo is worse
      # than saying so. Re-enable once that debt is paid:
      # - run: npx tsc --noEmit
      - name: Production build
        run: npm run build:frontend
      # No lint step: `npm run lint` is an echo stub and eslint is not a dependency.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Key-shaped strings
        # git grep exits 1 when nothing matches, which is the pass case.
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}|sk-[0-9a-f]{32}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':!package-lock.json' ':!backend/package-lock.json'; then
            echo '::error::key-shaped string found in the tree (matches above)'
            exit 1
          fi
